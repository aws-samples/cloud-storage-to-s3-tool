

#spring.thymeleaf.cache=true

# Credentials come from environment variables. The app will not start without APP_PASSWORD.
spring.security.user.name=${APP_USERNAME:admin}
spring.security.user.password=${APP_PASSWORD}

# Listen on localhost only unless SERVER_ADDRESS is set.
server.address=${SERVER_ADDRESS:127.0.0.1}

# Only expose the health endpoint (no /env, /configprops, /heapdump).
management.endpoints.web.exposure.include=health
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=never


# Templates reloading during development
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.cache=false

# Static resources reloading during development
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0


dynamodb.table.name.instance=clone_instance
dynamodb.table.name.config=clone_config
dynamodb.table.name.task=clone_task

sqs.queue.name=data-to-aws-s3-sqs-queue.fifo

